services:
  db:
    image: postgres:17
    container_name: calorie_tracker_db
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/1-init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: calorie_tracker_pgadmin
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"

volumes:
  pgdata:
